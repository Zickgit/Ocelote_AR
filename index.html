<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2660">
  <title>Ocelote UNACH · Realidad Aumentada</title>
  <meta name="description" content="Mira al Ocelote de la UNACH en realidad aumentada con la cámara de tu celular.">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Decodificador Draco local (sin depender de servidores externos)
    self.ModelViewerElement = self.ModelViewerElement || {};
    self.ModelViewerElement.dracoDecoderLocation = new URL('vendor/draco/', location.href).href;
  </script>
  <script type="module" src="vendor/model-viewer.min.js"></script>
</head>
<body>
  <header class="top">
    <h1>Ocelote <span>UNACH</span></h1>
    <p class="hint" id="hint">Toca <strong>Ver en tu espacio</strong> y apunta la cámara al piso.</p>
  </header>

  <model-viewer
    id="ocelote"
    src="models/ocelote.glb"
    ios-src="models/ocelote.usdz"
    alt="Ocelote, mascota de la UNACH, animado en 3D"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="auto"
    camera-controls
    touch-action="pan-y"
    camera-orbit="20deg 80deg auto"
    shadow-intensity="1"
    shadow-softness="0.8"
    environment-image="neutral"
    exposure="1.05"
    animation-name="Idle"
    animation-crossfade-duration="350"
    autoplay
    interaction-prompt="none">

    <div class="progress" slot="progress-bar"><div class="progress-fill"></div></div>

    <button slot="ar-button" class="ar-button" id="ar-button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5Zm0 2.3L18.7 8 12 11.7 5.3 8 12 4.3ZM5 9.7l6 3.3v6.7l-6-3.3V9.7Zm8 10V13l6-3.3v6.7l-6 3.3Z"/></svg>
      Ver en tu espacio
    </button>

    <nav class="controls" id="controls" aria-label="Animaciones">
      <button data-anim="Saludo">👋 Saludar</button>
      <button data-anim="Hablar" id="btn-hablar">💬 Hablar</button>
      <button data-anim="Celebrar">🎉 Celebrar</button>
      <button data-anim="Caminar">🚶 Caminar</button>
      <button data-anim="Idle">🧍 Reposo</button>
      <button id="btn-sound" class="icon" aria-pressed="true" title="Sonido">🔊</button>
    </nav>
  </model-viewer>

  <aside class="desktop-note" id="desktop-note" hidden>
    <img src="qr/ocelote-qr.svg" alt="Código QR para abrir esta página en el celular" width="140" height="140">
    <p>La realidad aumentada funciona en celular.<br>Escanea este código con la cámara de tu teléfono.</p>
  </aside>

  <audio id="voz" preload="auto" playsinline></audio>

  <script src="js/app.js" type="module"></script>
</body>
</html>
