<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>QR · Ocelote UNACH en Realidad Aumentada</title>
  <style>
    @page { size: letter; margin: 18mm; }
    body { font-family: system-ui, sans-serif; color: #0f2660; text-align: center; margin: 0; padding: 24px; }
    .card { display: inline-block; border: 4px solid #f2b800; border-radius: 24px; padding: 28px 36px; }
    h1 { margin: 0 0 4px; font-size: 2.2rem; }
    h1 span { color: #c99600; }
    p { margin: 6px 0; font-size: 1.1rem; }
    img { width: 300px; height: 300px; margin: 16px 0; }
    ol { text-align: left; display: inline-block; font-size: 1rem; margin: 8px 0 0; }
    @media print { .no-print { display: none; } }
  </style>
</head>
<body>
  <div class="card">
    <h1>Ocelote <span>UNACH</span></h1>
    <p>¡Escanéame y mira al Ocelote en tu espacio!</p>
    <img src="ocelote-qr.svg" alt="Código QR">
    <ol>
      <li>Abre la cámara de tu celular y apunta al código.</li>
      <li>Toca el enlace y luego <strong>“Ver en tu espacio”</strong>.</li>
      <li>Apunta la cámara al piso y mueve el teléfono despacio.</li>
    </ol>
  </div>
  <p class="no-print"><button onclick="print()">Imprimir</button></p>
</body>
</html>
